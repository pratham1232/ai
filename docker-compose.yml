version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: internship_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: password123
      MYSQL_DATABASE: internshipDB
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./backend/database_dump.sql:/docker-entrypoint-initdb.d/init.sql

  # Python AI Engine
  ai-engine:
    build:
      context: ./backend/ai-engine
      dockerfile: Dockerfile
    container_name: internship_ai_engine
    restart: always
    environment:
      - PORT=8000
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASS=password123
      - DB_NAME=internshipDB
    ports:
      - "8000:8000"
    depends_on:
      - mysql

  # Node.js Backend & API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: internship_backend
    restart: always
    environment:
      - PORT=5000
      - NODE_ENV=production
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASS=password123
      - DB_NAME=internshipDB
      - AI_ENGINE_URL=http://ai-engine:8000
    ports:
      - "5000:5000"
    depends_on:
      - mysql
      - ai-engine

volumes:
  db_data:
