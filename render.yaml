services:
  - type: web
    name: ai-internship-recommender
    env: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: CI
        value: "false"
      - key: DISABLE_ESLINT_PLUGIN
        value: "true"
